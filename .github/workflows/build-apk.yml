name: build-apk

# Fork-only: build installable APKs and upload them as artifacts.
# Mirrors .github/workflows/happy-android.yml (same toolchain, same tasks),
# but adds artifact upload. No signing secrets required:
#   debug   -> debug-signed, applicationId com.slopus.happy.dev
#   preview -> debug-signed, minified, applicationId com.slopus.happy.preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/happy-android
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug + preview
        run: ./gradlew --console=plain assembleDebug assemblePreview
      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-out"
      - uses: actions/upload-artifact@v4
        with:
          name: happy-android-apks
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30
